<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주 마켓 | 제주 특산물 쇼핑</title>
  <meta name="description" content="감귤, 한라봉, 오메기떡까지. 제주의 맛을 집으로.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="container topbar-inner">
    <a href="#" class="brand"><span class="brand-mark">🍊</span>제주 <b>마켓</b></a>
    <div class="topbar-right">
      <span class="api-pill" id="apiPill" title="백엔드 연결 상태"><i></i><span>연결 확인 중</span></span>
      <button class="cart-btn" id="cartOpen" aria-label="장바구니 열기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="hero">
    <div class="container hero-inner">
      <div>
        <span class="eyebrow">산지 직송 · 오늘 주문 내일 출발</span>
        <h1>제주의 맛을<br><em>집 앞까지</em></h1>
        <p>햇살 머금은 감귤부터 바다 내음 가득한 옥돔까지.<br>3만 원 이상 주문하면 배송비가 무료예요.</p>
        <a href="#shop" class="btn btn-primary">쇼핑 시작하기</a>
      </div>
      <div class="hero-art" aria-hidden="true">
        <span class="float f1">🍊</span><span class="float f2">🍵</span><span class="float f3">🍡</span><span class="float f4">🗿</span>
      </div>
    </div>
  </section>

  <section class="container shop" id="shop">
    <div class="shop-head">
      <h2>제주 특산물</h2>
      <div class="chips" id="chips" role="tablist"></div>
    </div>
    <div class="grid" id="grid" aria-live="polite"></div>
  </section>
</main>

<footer class="footer">
  <div class="container">© 2026 제주 마켓 · 학습용 예제입니다. 실제 결제는 이루어지지 않습니다.</div>
</footer>

<!-- 장바구니 드로어 -->
<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="장바구니">
  <div class="drawer-head">
    <h3>장바구니 <span id="drawerCount"></span></h3>
    <button class="icon-btn" id="cartClose" aria-label="닫기">✕</button>
  </div>

  <div class="ship-bar" id="shipBar">
    <p id="shipText"></p>
    <div class="ship-track"><div class="ship-fill" id="shipFill"></div></div>
  </div>

  <ul class="cart-list" id="cartList"></ul>

  <div class="drawer-foot" id="drawerFoot">
    <dl class="sum">
      <div><dt>상품 금액</dt><dd id="sumSub">0원</dd></div>
      <div><dt>배송비</dt><dd id="sumShip">0원</dd></div>
      <div class="sum-total"><dt>결제 예정 금액</dt><dd id="sumTotal">0원</dd></div>
    </dl>
    <button class="btn btn-primary btn-block" id="checkoutBtn">주문하기</button>
    <button class="btn-text" id="clearBtn">장바구니 비우기</button>
  </div>
</aside>

<!-- 주문 완료 -->
<div class="modal" id="orderModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="orderTitle">
    <div class="modal-emoji">🎉</div>
    <h3 id="orderTitle">주문이 완료되었어요!</h3>
    <p id="orderText"></p>
    <button class="btn btn-primary btn-block" id="orderClose">계속 쇼핑하기</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
